<nav aria-label="Migas de pan">
  <ol class="breadcrumb">
    @for (item of items(); track $index; let last = $last) {
      <li class="breadcrumb-item">
        @if (!last && item.url) {
          <a [routerLink]="item.url">{{ item.label }}</a>
        } @else {
          <span [attr.aria-current]="last ? 'page' : null">{{ item.label }}</span>
        }
      </li>
    }
  </ol>
</nav>
