<section class="card p-4">
  <h1>Lista de asistencia</h1>
  <p>Genera una lista imprimible para tu grupo.</p>
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label" for="attendance-group">Grupo</label>
      <select id="attendance-group" class="form-select" [value]="groupId()" (change)="groupId.set($any($event.target).value); subjectId.set('')" required>
        <option value="">Selecciona un grupo</option>
        @for (group of groups(); track group.id) { <option [value]="group.id">{{ group.name }}</option> }
      </select>
    </div>
    <div class="col-md-6">
      <label class="form-label" for="attendance-subject">Asignatura</label>
      <select id="attendance-subject" class="form-select" [value]="subjectId()" (change)="subjectId.set($any($event.target).value)" [disabled]="!selectedGroup()">
        <option value="">Lista general del grupo</option>
        @for (subject of selectedGroup()?.subjects ?? []; track subject.id) { <option [value]="subject.id">{{ subject.name }}</option> }
      </select>
    </div>
    <div class="col-md-6">
      <label class="form-label" for="attendance-start">Fecha de inicio</label>
      <input id="attendance-start" class="form-control" type="date" [value]="startDate()" (change)="startDate.set($any($event.target).value)" required />
    </div>
    <div class="col-md-6">
      <label class="form-label" for="attendance-days">Días hábiles</label>
      <input id="attendance-days" class="form-control" type="number" min="1" max="14" [value]="days()" (input)="days.set(+$any($event.target).value)" required />
    </div>
  </div>
  <div class="mt-3">
    <button class="btn btn-primary" type="button" (click)="download()" [disabled]="loading() || !groupId() || !startDate() || days() < 1 || days() > 14">
      {{ loading() ? 'Generando…' : 'Descargar PDF' }}
    </button>
  </div>
</section>
