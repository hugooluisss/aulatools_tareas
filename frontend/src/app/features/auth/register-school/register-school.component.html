<section class="auth-card card">
  <h1>Registrar escuela</h1>
  <p>Crea la escuela y la cuenta administrativa.</p>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label for="school">Nombre de la escuela</label>
    <input id="school" class="form-control" formControlName="school_name" />
    <label for="first">Nombre</label>
    <input id="first" class="form-control" formControlName="first_name" />
    <label for="last">Apellido</label>
    <input id="last" class="form-control" formControlName="last_name" />
    <label for="email">Correo electrónico</label>
    <input
      id="email"
      class="form-control"
      type="email"
      formControlName="email"
      autocomplete="email"
    />
    <label for="password">Contraseña (mínimo 8 caracteres)</label>
    <input
      id="password"
      class="form-control"
      type="password"
      formControlName="password"
      autocomplete="new-password"
    />
    <p class="error" role="alert">{{ error() }}</p>
    <button class="btn btn-primary w-100" type="submit">Crear escuela</button>
  </form>
  <a routerLink="/login">Volver a iniciar sesión</a>
</section>
