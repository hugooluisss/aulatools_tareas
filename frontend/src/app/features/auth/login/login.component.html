<main class="auth-page">
  <section class="auth-split card">
    <div class="auth-brand" aria-label="aulatools Tareas">
      <div class="auth-brand__badge">aulatools<small>Tareas</small></div>
    </div>
    <div class="auth-content">
      <h1>Iniciar sesión</h1>
      <p>Ingresa a tu espacio escolar.</p>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <label for="email">Correo electrónico</label>
        <div class="auth-field"><i class="bi bi-envelope" aria-hidden="true"></i><input id="email" class="form-control" type="email" formControlName="email" autocomplete="email" /></div>
        <label for="password">Contraseña</label>
        <div class="auth-field"><i class="bi bi-lock" aria-hidden="true"></i><input id="password" class="form-control" type="password" formControlName="password" autocomplete="current-password" /></div>
        <p class="error" role="alert">{{ error() }}</p>
        <button class="btn btn-primary w-100" type="submit">Entrar</button>
      </form>
      <nav class="auth-links"><a routerLink="/forgot-password">¿Olvidaste tu contraseña?</a><a routerLink="/register-school">Registrar una escuela</a></nav>
    </div>
  </section>
</main>
