<main class="auth-page">
  <section class="auth-split card">
    <div class="auth-brand" aria-label="aulatools Tareas"><div class="auth-brand__badge">aulatools<small>Tareas</small></div></div>
    <div class="auth-content">
      <h1>Nueva contraseña</h1>
      <p>Elige una contraseña de al menos 8 caracteres.</p>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <label for="password">Contraseña nueva</label>
        <div class="auth-field"><i class="bi bi-lock" aria-hidden="true"></i><input id="password" class="form-control" type="password" formControlName="password" autocomplete="new-password" /></div>
        <label for="confirmation">Confirmar contraseña</label>
        <div class="auth-field"><i class="bi bi-lock" aria-hidden="true"></i><input id="confirmation" class="form-control" type="password" formControlName="confirmation" autocomplete="new-password" /></div>
        <p class="error" role="alert">{{ error() }}</p>
        <button class="btn btn-primary w-100" type="submit">Guardar contraseña</button>
      </form>
      <nav class="auth-links"><a routerLink="/login">Volver a iniciar sesión</a></nav>
    </div>
  </section>
</main>
