<header class="page-header">
  <app-breadcrumbs [items]="[{ label: 'Mis tareas' }]" />
  <h1>Mis tareas</h1>
  <label for="task-status">Filtrar por estado</label>
  <select id="task-status" class="form-select" [(ngModel)]="status" (change)="filterChanged()">
    @for (filter of filters; track filter.value) {
      <option [value]="filter.value">{{ filter.label }}</option>
    }
  </select>
  @if (cycles().length > 1) {
    <label for="student-cycle">Ciclo</label>
    <select
      id="student-cycle"
      class="form-select"
      [value]="cycleId() ?? 0"
      (change)="cycleId.set(+$any($event.target).value); filterChanged()"
    >
      <option value="0">Selecciona un ciclo</option>
      @for (cycle of cycles(); track cycle.id) {
        <option [value]="cycle.id">{{ cycle.name }}</option>
      }
    </select>
  }
</header>
<app-data-table [page]="rows()" [loading]="loading()" (pageChange)="load($event)">
  <app-column header="Tarea"
    ><ng-template let-row>{{ row.task.name }}</ng-template></app-column
  >
  <app-column header="Materia"
    ><ng-template let-row>{{ row.subject.name }}</ng-template></app-column
  >
  <app-column header="Calificación"
    ><ng-template let-row>{{ row.delivery.grade ?? '—' }}</ng-template></app-column
  >
  <app-column header="Estado"
    ><ng-template let-row>{{ statusLabel(row.delivery.status) }}</ng-template></app-column
  >
  <app-column header="Vencimiento"
    ><ng-template let-row
      >{{ row.task.due_at + 'T00:00:00' | date: 'dd/MM/yyyy' }}
      @if (row.delivery.overdue) {
        <span class="badge text-bg-danger">Vencida</span>
      }
    </ng-template></app-column
  >
  <app-column header="Detalle"
    ><ng-template let-row
      ><a [routerLink]="['/my-tasks', row.delivery.id]">Ver detalle</a></ng-template
    ></app-column
  >
</app-data-table>
