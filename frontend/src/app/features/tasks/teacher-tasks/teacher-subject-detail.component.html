<h1>Materia</h1>
@if (cycles().length > 1) {
  <label for="task-cycle">Ciclo</label>
  <select
    id="task-cycle"
    class="form-select mb-3"
    [value]="cycleId() ?? 0"
    (change)="cycleId.set(+$any($event.target).value); filterChanged()"
  >
    <option value="0">Selecciona un ciclo</option>
    @for (cycle of cycles(); track cycle.id) {
      <option [value]="cycle.id">{{ cycle.name }}</option>
    }
  </select>
}
<section class="card p-4 mb-4">
  <h2>Estudiantes inscritos</h2>
  <app-data-table [page]="students()" (pageChange)="loadStudents($event)">
    <app-column header="Matrícula"><ng-template let-row>{{ row.enrollment_number }}</ng-template></app-column>
    <app-column header="Estudiante"><ng-template let-row>{{ row.first_name }} {{ row.last_name }}</ng-template></app-column>
  </app-data-table>
</section>
<section class="card p-4">
  <div class="section-heading">
    <h2>Tareas</h2>
    @if (!isAdmin) {
      <app-icon-button icon="plus-circle" label="Agregar tarea" (click)="createTask()" />
    }
  </div>
  <app-data-table [page]="tasksList()" (pageChange)="loadTasks($event)">
    <app-column header="Nombre"><ng-template let-row>{{ row.name }}</ng-template></app-column>
    <app-column header="Vencimiento"><ng-template let-row>{{ row.due_at | date: 'medium' }}</ng-template></app-column>
    <app-column header="Estado"><ng-template let-row>{{ statusLabel(row.status) }}</ng-template></app-column>
    <app-column header="Acciones"><ng-template let-task>
              <app-icon-button
                icon="eye"
                label="Ver entregas"
                [routerLink]="['/tasks', task.id, 'deliveries']"
              />
              @if (!isAdmin) {
                <app-icon-button icon="pencil" label="Editar tarea" (click)="editTask(task)" />
                <app-icon-button
                  icon="x-circle"
                  label="Cancelar tarea"
                  (click)="cancelTask(task)"
                />
              }
    </ng-template></app-column>
  </app-data-table>
</section>
