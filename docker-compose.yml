services:
  backend:
    build:
      context: ./backend
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8090:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      MAILER_DSN: ${MAILER_DSN:-smtp://mailpit:1025}
      MAIL_FROM: ${MAIL_FROM:-no-reply@aulatools.local}
      APP_URL: ${APP_URL:-http://localhost:4330/aulatools-tareas_frontend}
    command: ["php", "-S", "0.0.0.0:8080", "-t", "public", "public/index.php"]
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "4330:4200"
    command: ["sh", "-c", "if [ ! -x node_modules/.bin/ng ]; then npm ci; fi; npx ng serve --host 0.0.0.0 --serve-path /aulatools-tareas_frontend/ --allowed-hosts"]
    restart: unless-stopped

volumes:
  frontend_node_modules:
